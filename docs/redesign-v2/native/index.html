let theme='light',narrow=false;function refresh(){document.querySelectorAll('[data-screen]').forEach(img=>{const src=(narrow?'320dp/':'')+'redesign-'+theme+'-'+img.dataset.screen+'.png';img.src=src;img.parentElement.href=src});document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));document.querySelector('#width').setAttribute('aria-pressed',String(narrow))}document.querySelectorAll('[data-theme]').forEach(b=>b.addEventListener('click',()=>{theme=b.dataset.theme;refresh()}));document.querySelector('#width').addEventListener('click',()=>{narrow=!narrow;refresh()});
